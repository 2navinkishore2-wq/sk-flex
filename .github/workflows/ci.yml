name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    name: Tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  cloud-verify:
    name: Cloud verification (Firebase emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Run emulator cloud checks (auth, isolation, sync, offline, duplicates, numbering, persistence)
        run: npm run cloud:verify
        timeout-minutes: 15
